version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - vault_data:/app/vault
      - chroma_data:/app/chroma_db
      - db_data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHROMA_PATH=/app/chroma_db
      - VAULT_PATH=/app/vault
      - DATABASE_URL=sqlite+aiosqlite:////app/data/docvault.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  vault_data:
  chroma_data:
  db_data:
